name: Build BB10 Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: bb10-source

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Clone Lawnchair
        run: |
          git clone --branch 12-dev --recurse-submodules https://github.com/LawnchairLauncher/lawnchair.git launcher
          cd launcher
          git submodule update --init --recursive

      - name: Copy BB10 files
        run: |
          mkdir -p launcher/lawnchair/src/app/lawnchair/bb10hub
          cp bb10-source/lawnchair/src/app/lawnchair/bb10hub/*.kt launcher/lawnchair/src/app/lawnchair/bb10hub/ || true
          mkdir -p launcher/lawnchair/src/main/res/values launcher/lawnchair/src/main/res/xml launcher/lawnchair/src/main/res/layout
          cp bb10-source/lawnchair/src/main/res/values/*.xml launcher/lawnchair/src/main/res/values/ || true
          cp bb10-source/lawnchair/src/main/res/xml/*.xml launcher/lawnchair/src/main/res/xml/ || true
          cp bb10-source/lawnchair/src/main/res/layout/*.xml launcher/lawnchair/src/main/res/layout/ || true

      - name: Build APK
        run: |
          cd launcher
          chmod +x gradlew
          ./gradlew assembleLawnWithQuickstepDebug --stacktrace || true

      - name: Collect APKs
        run: |
          mkdir -p artifacts
          find launcher -name "*.apk" -type f -exec cp {} artifacts/ \; || true
          ls -la artifacts/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bb10-hub-debug
          path: artifacts/
          if-no-files-found: warn
